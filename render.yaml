services:
  - type: web
    name: panini-comics-monitor
    runtime: docker
    plan: free
    healthCheckPath: /status
    envVars:
      - key: CHECK_INTERVAL_SECONDS
        value: "300"
      - key: ALERT_ON_NEW_PRODUCTS
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: NTFY_TOPIC
        sync: false
      - key: WATCHLIST_KEYWORDS
        sync: false
