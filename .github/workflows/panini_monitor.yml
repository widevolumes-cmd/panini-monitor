name: Monitoreo 24/7 Tienda Panini (Marvel & DC)

on:
  schedule:
    # Se ejecuta automáticamente cada 10 minutos, 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic desde la pestaña Actions

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ligero (Sin dependencias externas)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar escaneo de stock (Marvel & DC)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WATCHLIST_KEYWORDS: ${{ secrets.WATCHLIST_KEYWORDS }}
          ALERT_ON_NEW_PRODUCTS: ${{ secrets.ALERT_ON_NEW_PRODUCTS }}
        run: |
          python3 monitor.py --once --state-file data/panini_state.json

      - name: Guardar estado actualizado de inventario en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/panini_state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(state): actualizar estado de stock Marvel & DC [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          else
            echo "Sin cambios en el inventario durante este ciclo."
          fi
